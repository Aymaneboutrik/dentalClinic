events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        resolver 127.0.0.11 valid=30s; # Docker DNS resolver

        # Define variables for upstreams to prevent Nginx from crashing on startup if hosts aren't resolvable
        set $auth_service_url http://auth-service:8080;
        set $personnel_service_url http://personnel-service:8080;
        set $stock_api_url http://stock-api:8080;
        set $patient_service_url http://patient-service:8081;
        set $frontend_url http://frontend:5173;

        # Suppression des CORS redondants (gérés par le backend)
        # Mais on garde la gestion des OPTIONS pour le pré-vol
        location /api {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # Personnel Service
            location /api/personnel {
                proxy_pass $personnel_service_url;
            }

            # Auth Service & Users
            location /api/auth {
                proxy_pass $auth_service_url;
            }

            location /api/users {
                proxy_pass $auth_service_url;
            }

            # Stock API
            location /api/stock {
                proxy_pass $stock_api_url;
            }

            # Patient Service
            location /api/patients { proxy_pass $patient_service_url; }
            location /api/consultations { proxy_pass $patient_service_url; }
            location /api/documents { proxy_pass $patient_service_url; }
            location /api/ordonnances { proxy_pass $patient_service_url; }
            location /api/assistant { proxy_pass $patient_service_url; }
            location /api/sec { proxy_pass $patient_service_url; }

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend Proxy (Vite Dev Server)
        location / {
            proxy_pass $frontend_url;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}