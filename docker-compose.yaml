version: "3.9"

services:
  personnel-db:
    image: postgres:16
    container_name: personnel-db
    environment:
      POSTGRES_DB: personnel_db
      POSTGRES_USER: personnel_user
      POSTGRES_PASSWORD: personnel_pass
    ports:
      - "5432:5432"
    volumes:
      - personnel_db_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - personnel-db

  personnel-service:
    container_name: personnel-service
    build:
      context: ./Backend/Service Personnel
      dockerfile: Dockerfile
    ports:
      - "5001:8080"
    depends_on:
      - personnel-db
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: Host=personnel-db;Port=5432;Database=personnel_db;Username=personnel_user;Password=personnel_pass

volumes:
  personnel_db_data: